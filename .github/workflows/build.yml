name: Build

# Checks that every push and pull request still compiles. Nothing is published.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build SanctumPresets/SanctumPresets.csproj --configuration Release

      - name: Store build
        uses: actions/upload-artifact@v4
        with:
          name: SanctumPresets
          path: SanctumPresets/bin/**/Release/**/*
          if-no-files-found: error
          retention-days: 7
